seed: 42
prompt_version: v3

paths:
  data_dir: data
  chroma_dir: data/chroma
  results_dir: results

embedding:
  model_name: NeuML/pubmedbert-base-embeddings
  batch_size: 64
  device: cuda

corpus:
  num_distractors: 20000

retrieval:
  collection_name: pubmed_abstracts
  top_k: 5

splits:
  dev_size: 100

llm:
  model_name: Qwen/Qwen2.5-7B-Instruct
  load_in_4bit: true
  batch_size: 4
  max_new_tokens: 192

graph:
  ner_model: d4data/biomedical-ner-all
  ner_batch_size: 32
  min_df: 2
  max_df_ratio: 0.05
  max_entities_per_doc: 15
  neighbours_per_entity: 3
  neighbour_weight: 0.0
  max_facts: 6
  use_ngram_seeds: true
  normalize: false

hybrid:
  rrf_k: 60
  candidate_k: 20
  vector_weight: 1.0
  graph_weight: 0.5